<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeateGis - WebGIS Chieti</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Centro mappa su Chieti
    const map = L.map('map').setView([42.3510, 14.1675], 14);

    // BASE 1: OpenStreetMap
    const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // BASE 2: Esri Satellite
    const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    });

    // BASE 3: Ortofoto Geoportale Nazionale (PCN)
    const ortofotoPCN = L.tileLayer.wms('http://wms.pcn.minambiente.it/ogc?map=/ms_ogc/WMS_v1.3/raster/ortofoto_colore_12.map', {
      layers: 'ortofoto_colore_12',
      format: 'image/jpeg',
      transparent: false,
      version: '1.1.1',
      attribution: 'Ortofoto &copy; Geoportale Nazionale'
    });

    // OVERLAY 1: WMS Catasto Agenzia delle Entrate
    const wmsCatasto = L.tileLayer.wms('https://wms.cartografia.agenziaentrate.gov.it/inspire/wms/ows01.php', {
      layers: 'CP.CadastralParcel',
      format: 'image/png',
      transparent: true,
      attribution: 'Cartografia Catastale &copy; Agenzia delle Entrate'
    });

    // Controllo Layer
    const baseMaps = {
      "Stradale (OpenStreetMap)": osm,
      "Satellite (Esri)": satellite,
      "Ortofoto Regione Abruzzo": ortofotoAbruzzo
    };

    const overlayMaps = {
      "Catasto Particelle (WMS AdE)": wmsCatasto
    };

    L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
    L.control.scale({ imperial: false, metric: true }).addTo(map);
  </script>
</body>
</html>
